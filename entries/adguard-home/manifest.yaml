id: adguard-home
name: AdGuard Home
summary: Block ads and trackers for every device on your network.
description: |
  A network-wide ad and tracker blocker that works as your home DNS server.
  It takes an address of its own on your home network, which is the address
  you give your devices as their DNS server, and starts before anything
  else on its Node.
icon: icon.svg
category: network
image: docker.io/adguard/adguardhome:v0.107.59@sha256:5d5e3aef39a8c8906a324f0c2da0a6123929e459b57c1e3f05e401dca5c7bf02
version: "0.107.59"
project: https://github.com/AdguardTeam/AdGuardHome
exposure: private
own_login: true
infrastructure: true
lan: true
web:
  port: 3000
  path: /
grants:
  - option: Network=lan
    why: Takes an address of its own on your home network, which is the address you give your devices as their DNS server. Every device in your home can reach it there, on every port it answers on.
settings:
  - key: lan_address
    label: Address on your home network
    type: address
volumes:
  - name: work
    path: /opt/adguardhome/work
  - name: conf
    path: /opt/adguardhome/conf
health:
  http: /
source:
  from: hand
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/adguard-home.svg
