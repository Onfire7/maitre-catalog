id: bazarr
name: Bazarr
summary: Find and download subtitles for the films and series Sonarr and Radarr keep.
description: |
  Bazarr looks up subtitles in the languages you want for everything in your Sonarr and Radarr libraries, and keeps them up to date.
  The first visit sets up its login.
icon: icon.svg
category: media
image: docker.io/linuxserver/bazarr:1.5.6@sha256:047222423d6d8556a88581b189175bec57f286f120b52ba29c0390fe6babaa5a
version: 1.5.6
project: https://github.com/morpheus65535/bazarr
exposure: private
own_login: true
web:
  port: 6767
  path: /
volumes:
  - name: config
    path: /config
  - name: movies
    path: /movies
    shared: true
  - name: tv_shows
    path: /tv
    shared: true
settings:
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/9619b7090994557756e9b4f6f439d0c3deda4e2e/Apps/Bazarr/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/bazarr.svg
