id: calibre-web
name: Calibre-Web
summary: Browse, read and download the ebooks of your Calibre library.
description: |
  Calibre-Web gives your Calibre library a web page: browse and search your books,
  read them in the browser, send them to an ereader or download them. Point it at
  the shared folder that holds your library's metadata.db. Sign in first as admin
  with the password admin123, then change it.
icon: icon.svg
category: media
image: docker.io/linuxserver/calibre-web:0.6.24@sha256:241009026e6fa74238b2cb3fec755c4c64474e94a1e434f5731ed6ca409c8054
version: 0.6.24
exposure: private
own_login: true
web:
  port: 8083
  path: /
volumes:
  - name: books
    path: /books
    shared: true
  - name: config
    path: /config
settings:
  - key: PGID
    label: Run Calibre-web as this group id.
    type: text
    default: '1000'
  - key: PUID
    label: Run Calibre-web as this user id.
    type: text
    default: '1000'
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/9619b7090994557756e9b4f6f439d0c3deda4e2e/Apps/Calibre-web/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/calibre-web.svg
