id: code-server
name: code-server
summary: VS Code in the browser, running on your server.
description: |
  code-server runs VS Code on the Node, so you can edit code and use a terminal
  from any browser. Its password is made up at install; copy it from the
  Service's settings.
icon: icon.png
category: tools
image: docker.io/linuxserver/code-server:4.143.1@sha256:4524d0b00478e41264f42e0e660c1819e3b7d0c460f78ce73e44fa39b2b55134
version: 4.143.1
project: https://github.com/coder/code-server
exposure: private
own_login: true
web:
  port: 8443
  path: /
volumes:
  - name: config
    path: /config
  - name: projects
    path: /projects
settings:
  - key: PASSWORD
    label: Password to open it
    type: password
    default: generate
  - key: SUDO_PASSWORD
    label: Password for sudo in its terminal
    type: password
    default: generate
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /healthz
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/05e3501e90017f2eb74d29f5d5bef13c3615a0af/Apps/code-server/docker-compose.yml
  licence: MIT
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/png/code-server.png
