id: duplicati
name: Duplicati
summary: Encrypted, scheduled backups of your folders to the cloud or another disk.
description: |
  Duplicati backs up the shared folders you give it, encrypted and
  deduplicated, to cloud storage, another server or the backups folder, on a
  schedule. The first visit sets its password.
icon: icon.svg
category: tools
image: docker.io/linuxserver/duplicati:2.1.0@sha256:ea0fc5050e0369e3d6736ac4633c65a977668889aed949aaa312ba4c73c8c772
version: 2.1.0
project: https://github.com/duplicati/duplicati
exposure: private
own_login: true
web:
  port: 8200
  path: /
volumes:
  - name: backups
    path: /backups
    shared: true
  - name: config
    path: /config
  - name: source
    path: /source
    shared: true
settings:
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/9619b7090994557756e9b4f6f439d0c3deda4e2e/Apps/Duplicati/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/duplicati.svg
