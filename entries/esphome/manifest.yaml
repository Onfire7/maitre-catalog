id: esphome
name: ESPHome
summary: Write and flash firmware for ESP32 and ESP8266 boards, and see them online.
description: |
  ESPHome turns cheap ESP32 and ESP8266 boards into sensors and switches for
  Home Assistant: describe a device in YAML, build its firmware and update it
  over the air. Flash a new board from the browser over USB.
icon: icon.svg
category: home
image: ghcr.io/esphome/esphome:2026.5.1@sha256:7886a4b0f04bd7d5e092e0b0cae277a47e39088d4d9028935df3304655300acd
version: 2026.5.1
project: https://github.com/esphome/esphome
exposure: private
own_login: false
web:
  port: 6052
  path: /
volumes:
  - name: config
    path: /config
settings:
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/9619b7090994557756e9b4f6f439d0c3deda4e2e/Apps/ESPHome/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/esphome.svg
grants:
  - option: Network=host
    why: Finds your ESPHome devices on the home network by their mDNS announcements, to show which are online and update them by name. Its page is then also open on your home network at the Node's address, port 6052.
    optional: discovery
    without: Devices are checked by ping instead, and updated by address.
