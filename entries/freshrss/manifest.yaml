id: freshrss
name: FreshRSS
summary: Follow websites, blogs and news through their feeds, in one place.
description: |
  FreshRSS gathers the RSS and Atom feeds you follow and lets you read them in one
  list, in the browser or in any app that speaks its API. The first visit runs its
  setup, where you create your account.
icon: icon.svg
category: tools
image: docker.io/freshrss/freshrss:1.29.1@sha256:ab6b363102ccdbc39f6a62db926f567c61a5289bf25ba460f1c34423d8cc1a4d
version: 1.29.1
project: https://github.com/FreshRSS/FreshRSS
exposure: private
own_login: true
web:
  port: 80
  path: /
volumes:
  - name: data
    path: /var/www/FreshRSS/data
  - name: extensions
    path: /var/www/FreshRSS/extensions
settings:
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/9619b7090994557756e9b4f6f439d0c3deda4e2e/Apps/FreshRSS/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/freshrss.svg
