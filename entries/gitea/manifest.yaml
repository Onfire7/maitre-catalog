id: gitea
name: Gitea
summary: Git hosting with pull requests, issues, a package registry and CI, like a small GitHub.
description: |
  Gitea hosts your Git repositories with code review, issues, wikis, releases, a
  package registry and GitHub-compatible Actions. The first visit runs its setup
  page and creates the administrator. Git over SSH is on the Node's port 222.
icon: icon.svg
category: tools
image: docker.io/gitea/gitea:1.27.3@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
version: 1.27.3
project: https://github.com/go-gitea/gitea
exposure: private
own_login: true
host_ports:
  - 222/tcp
web:
  port: 3000
  path: /
volumes:
  - name: data
    path: /data
health:
  http: /api/healthz
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/b14a0586a972c24b70da43a776ce6cd78b593f59/Apps/Gitea/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-11-02'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/gitea.svg
