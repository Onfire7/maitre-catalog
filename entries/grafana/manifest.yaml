id: grafana
name: Grafana
summary: Dashboards and alerts for your metrics, logs and traces.
description: |
  Grafana draws dashboards from Prometheus, InfluxDB, Loki, databases and many
  more, and alerts you when something crosses a line. Sign in first as admin
  with the password admin; it asks for a new one.
icon: icon.svg
category: tools
image: docker.io/grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
version: 13.3.0
project: https://github.com/grafana/grafana
exposure: private
own_login: true
web:
  port: 3000
  path: /
volumes:
  - name: data
    path: /var/lib/grafana
health:
  http: /api/health
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/9619b7090994557756e9b4f6f439d0c3deda4e2e/Apps/Grafana/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/grafana.svg
