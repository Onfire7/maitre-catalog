id: grocy
name: Grocy
summary: Track what is in your kitchen, what to buy, and the chores around the house.
description: |
  Grocy keeps stock of your food and household supplies with best-before dates,
  plans meals and shopping lists, and tracks chores, tasks and batteries. Sign in
  first as admin with the password admin, then change it.
icon: icon.svg
category: home
image: docker.io/linuxserver/grocy:4.7.1@sha256:6282144f9a14d4a4dca2bc96801a2e43a2ff51116f001b13e5488eacad7b80e2
version: 4.7.1
project: https://github.com/grocy/grocy
exposure: private
own_login: true
web:
  port: 9283
  path: /
volumes:
  - name: config
    path: /config
settings:
  - key: PGID
    label: 'Container Variable: PGID'
    type: text
    default: '1000'
  - key: PUID
    label: 'Container Variable: PUID'
    type: text
    default: '1000'
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/05e3501e90017f2eb74d29f5d5bef13c3615a0af/Apps/grocy/docker-compose.yml
  licence: MIT
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/grocy.svg
