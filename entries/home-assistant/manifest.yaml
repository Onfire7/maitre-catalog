id: home-assistant
name: Home Assistant
summary: Control your lights, heating, plugs and sensors from one place, without the cloud.
description: |
  Home Assistant connects the smart devices in your home, from lights and
  thermostats to plugs, sensors and speakers, and lets you control them
  together and automate them, all from your own server. The first visit
  creates its owner account.

  Its add-on store is part of Home Assistant OS and not of this install; the
  usual add-ons, such as Mosquitto and Zigbee2MQTT, are Services of their own.
  Bluetooth and Zigbee or Z-Wave sticks plugged into the Node are not yet
  available to it here.
category: home
image: ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
version: "2026.10.4"
project: https://github.com/home-assistant/core
exposure: private
own_login: true
web:
  port: 8123
  path: /
volumes:
  - name: config
    path: /config
settings:
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
grants:
  - option: Network=host
    why: Finds the devices on your home network by listening for their announcements (Chromecast, Sonos, HomeKit, smart plugs and most local integrations), and answers HomeKit on its own ports. Its page is then also open on your home network at the Node's address, port 8123.
    optional: discovery
    without: Add devices by their address. Integrations that find devices by themselves, and HomeKit, will not work.
health:
  http: /manifest.json
source:
  from: hand
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/home-assistant.svg
icon: icon.svg
