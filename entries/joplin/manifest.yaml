id: joplin
name: Joplin Server
summary: Sync your Joplin notes between devices through your own server.
description: |
  Joplin Server keeps the notes of the Joplin apps in step across your phone,
  computer and tablet, and shares notebooks. Sign in first as
  admin@localhost with the password admin, then change both.
icon: icon.svg
category: tools
version: 3.7.3
project: https://github.com/laurent22/joplin
exposure: private
own_login: true
web:
  port: 22300
  path: /
  component: app
volumes:
  - name: data
    path: /var/lib/postgresql/data
settings:
  - key: POSTGRES_PASSWORD
    label: 'Container Variable: POSTGRES_PASSWORD'
    type: password
    default: generate
health:
  http: /api/ping
components:
  - name: app
    image: docker.io/joplin/server:3.7.3@sha256:d951ce50b6d3d542393ebc4d08bd62d9a4fb0a6f6827abb861726c83560ecf97
    after:
      - db
  - name: db
    image: docker.io/library/postgres:14.2@sha256:2c954f8c5d03da58f8b82645b783b56c1135df17e650b186b296fa1bb71f9cfd
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/05e3501e90017f2eb74d29f5d5bef13c3615a0af/Apps/joplin/docker-compose.yml
  licence: MIT
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/joplin.svg
