id: librespeed
name: LibreSpeed
summary: Test the speed between your devices and your server, from any browser.
description: |
  LibreSpeed measures download, upload, ping and jitter between your browser
  and the Node, to check your home network and Wi-Fi.
icon: icon.svg
category: network
image: docker.io/linuxserver/librespeed:6.3.1@sha256:8f383ce2954aca618347387e255769b9a927c549daa3f29c12a18b418acb5193
version: 6.3.1
project: https://github.com/librespeed/speedtest
exposure: private
own_login: false
web:
  port: 80
  path: /
volumes:
  - name: config
    path: /config
settings:
  - key: PGID
    label: 'Container Variable: PGID'
    type: text
    default: '1000'
  - key: PUID
    label: 'Container Variable: PUID'
    type: text
    default: '1000'
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/05e3501e90017f2eb74d29f5d5bef13c3615a0af/Apps/librespeed/docker-compose.yml
  licence: MIT
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/librespeed.svg
