id: minecraft
name: Minecraft Server
summary: A Minecraft Java Edition server for you and your friends.
description: |
  Runs a Minecraft Java Edition server (vanilla by default) that players
  on your network can join at this Node's address. Turn on "Reachable from
  the internet" in the Console to let friends elsewhere join too; the Node
  asks your router to forward the game port for you.
icon: icon.svg
category: tools
image: docker.io/itzg/minecraft-server:2026.10.1-java21@sha256:07ab333a8542208c4c863a78fd3cf3fd1138d5a2e118306e1a316d202f69ab74
version: "2026.10.1"
exposure: private
own_login: false
host_ports:
  - 25565/tcp
port_forward: true
volumes:
  - name: data
    path: /data
    size: medium
settings:
  - key: EULA
    label: I accept the Minecraft End User License Agreement (minecraft.net/eula)
    type: bool
    default: "false"
  - key: VERSION
    label: Minecraft version
    type: text
    default: LATEST
  - key: MEMORY
    label: Memory for the server
    type: text
    default: 2G
  - key: MOTD
    label: Message shown in the server list
    type: text
    default: A Maître Server world
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
source:
  from: hand
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/minecraft.svg
