id: monica
name: Monica
summary: 'A personal CRM: remember the people in your life, with reminders, notes and gift ideas.'
description: |
  Monica keeps a page for each person who matters to you: how you met, their
  family, the conversations you had, birthdays and other dates to be reminded of,
  gifts given and planned, and a journal. Register the first account on the first
  visit.
icon: icon.svg
category: tools
version: 4.1.2
project: https://github.com/monicahq/monica
exposure: private
own_login: true
web:
  port: 80
  path: /
  component: app
volumes:
  - name: mysql
    path: /var/lib/mysql
  - name: storage
    path: /var/www/html/storage
settings:
  - key: APP_KEY
    label: Encryption key
    type: password
    default: generate
  - key: DB_PASSWORD
    label: Database password
    type: password
    default: generate
health:
  http: /
components:
  - name: app
    image: docker.io/library/monica:4.1.2@sha256:11830fa6335965c3e613eb16cb5c7755f4cf25bdb59806f5f782378651d372a3
    after:
      - db
  - name: db
    image: docker.io/library/mariadb:11.8.9@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/b14a0586a972c24b70da43a776ce6cd78b593f59/Apps/Monica/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-11-02'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/monica.svg
