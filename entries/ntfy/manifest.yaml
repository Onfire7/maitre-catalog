id: ntfy
name: ntfy
summary: Send notifications to your phone or computer from scripts and apps.
description: |
  ntfy delivers push notifications. Anything that can make a web request, a
  script, a backup job or Uptime Kuma, can send a message to a topic, and the ntfy
  app on your phone or desktop shows it. It has no accounts until you configure
  them: anyone who can reach it can send and read its topics.
icon: icon.svg
category: tools
image: docker.io/binwiederhier/ntfy:v2.34.0@sha256:901e14503d3f605f445be0e68f2ac71f0aa73391897ce6ceb599f8c48d8b3792
version: 2.34.0
project: https://github.com/binwiederhier/ntfy
exposure: remote
own_login: false
web:
  port: 80
  path: /
volumes:
  - name: cache
    path: /var/cache/ntfy
  - name: config
    path: /etc/ntfy
settings:
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /v1/health
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/05e3501e90017f2eb74d29f5d5bef13c3615a0af/Apps/ntfysh/docker-compose.yml
  licence: MIT
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
