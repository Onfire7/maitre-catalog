id: open-webui
name: Open WebUI
summary: A chat page for the language models you run, with Ollama or any OpenAI-style API.
description: |
  Open WebUI is a chat interface for language models: talk to models running in
  Ollama on your Node, or to any service with an OpenAI-compatible API, with
  history, documents and per-person accounts. The first account created is its
  admin. Install Ollama first, under the name ollama, or change the address.
icon: icon.svg
category: tools
image: ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded
version: 0.12.5
project: https://github.com/open-webui/open-webui
exposure: private
own_login: true
web:
  port: 8080
  path: /
volumes:
  - name: data
    path: /app/backend/data
settings:
  - key: OLLAMA_BASE_URL
    label: Address of Ollama
    type: text
    default: http://ollama:11434
health:
  http: /health
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/05e3501e90017f2eb74d29f5d5bef13c3615a0af/Apps/open-webui/docker-compose.yml
  licence: MIT
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/open-webui.svg
