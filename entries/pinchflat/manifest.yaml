id: pinchflat
name: Pinchflat
summary: Downloads YouTube channels and playlists as they publish, for Plex, Jellyfin or a podcast app.
description: |
  Pinchflat watches the YouTube channels and playlists you give it and downloads new
  videos or audio with yt-dlp, named and filed for a media server, with feeds a
  podcast app can follow. It is one container with no account to create.
icon: icon.png
category: media
image: ghcr.io/kieraneglin/pinchflat:latest@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202
version: 2025.9.26
project: https://github.com/kieraneglin/pinchflat
exposure: private
own_login: false
web:
  port: 8945
  path: /
volumes:
  - name: config
    path: /config
  - name: downloads
    path: /downloads
    shared: true
    size: large
settings:
  - key: PGID
    label: 'Container Variable: PGID'
    type: text
    default: '1000'
  - key: PUID
    label: 'Container Variable: PUID'
    type: text
    default: '1000'
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /healthcheck
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/b14a0586a972c24b70da43a776ce6cd78b593f59/Apps/Pinchflat/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-11-02'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/png/pinchflat.png
