id: plex
name: Plex
summary: Stream your films, series and music to every screen, with the Plex apps.
description: |
  Plex Media Server organises your films, series, music and photos and streams
  them to the Plex apps on TVs, phones and browsers. Sign in with your Plex
  account on the first visit to claim the server. Hardware transcoding with the
  Node's graphics card needs Plex Pass.
icon: icon.svg
category: media
image: lscr.io/linuxserver/plex:1.43.3@sha256:de95bb12db3ed4e34ad5983113b8af967cfd77786e15669c0703c22133e10107
version: 1.43.3
exposure: private
own_login: true
web:
  port: 32400
  path: /web/index.html
volumes:
  - name: config
    path: /config
  - name: media
    path: /Media
    shared: true
settings:
  - key: PGID
    label: Run Plex as this group id.
    type: text
    default: '1000'
  - key: PUID
    label: Run Plex as this user id.
    type: text
    default: '1000'
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
  - key: GPU
    label: Graphics card for hardware transcoding
    type: device
    device: video
  - key: PLEX_CLAIM
    label: Claim token from plex.tv/claim (only without discovery; valid four minutes)
    type: text
health:
  http: /identity
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/9619b7090994557756e9b4f6f439d0c3deda4e2e/Apps/Plex/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/plex.svg
grants:
  - option: Network=host
    why: Lets the Plex apps on your TVs and phones find the server on your home network, and lets you claim it from the first visit. Its page is then also open on your home network at the Node's address, port 32400.
    optional: discovery
    without: Apps find the server through your Plex account only; claim it with a token from plex.tv/claim (the Claim token setting).
  - option: AddDevice=*
    why: Uses the graphics card you picked to convert video for devices that cannot play it as it is, instead of the processor.
    optional: hardware_transcoding
    without: Video is converted by the processor, more slowly.
