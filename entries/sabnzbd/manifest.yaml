id: sabnzbd
name: SABnzbd
summary: 'Downloads from Usenet: give it an NZB and it fetches, repairs, unpacks and files the result.'
description: |
  SABnzbd downloads from Usenet servers. Give it an NZB file, or let Sonarr and
  Radarr send them, and it downloads, checks, repairs and unpacks the result into
  the shared Downloads folder. The first visit runs its setup wizard, which asks for
  your Usenet provider.
icon: icon.svg
category: media
image: docker.io/linuxserver/sabnzbd:5.1.3@sha256:a7cfba459929f73b83c98b476a845076dc72524af80b24fcb4200684e6b1b675
version: 5.1.3
project: https://github.com/sabnzbd/sabnzbd
exposure: private
own_login: false
web:
  port: 8080
  path: /
volumes:
  - name: config
    path: /config
  - name: downloads
    path: /downloads
    shared: true
  - name: incomplete
    path: /incomplete-downloads
settings:
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /api?mode=version
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/b14a0586a972c24b70da43a776ce6cd78b593f59/Apps/Sabnzbd/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-11-02'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/sabnzbd.svg
