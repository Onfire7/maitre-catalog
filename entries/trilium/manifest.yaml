id: trilium
name: Trilium Notes
summary: A personal knowledge base of notes in a tree, linked and searchable.
description: |
  Trilium keeps notes in a deep tree, with links between them, rich text, code,
  diagrams and scripting, synced with its desktop app. The first visit sets
  its password.
icon: icon.svg
category: tools
image: docker.io/triliumnext/trilium:v0.103.0@sha256:8e6bc939a6d5dbeed42d1b5b155bc790b1c28ca3ac414382d04d626903c62081
version: 0.103.0
project: https://github.com/TriliumNext/Trilium
exposure: private
own_login: true
web:
  port: 8080
  path: /
volumes:
  - name: trilium
    path: /home/node/trilium-data
health:
  http: /api/health-check
source:
  from: casaos
  url: https://github.com/IceWhaleTech/CasaOS-AppStore/blob/9619b7090994557756e9b4f6f439d0c3deda4e2e/Apps/Trilium/docker-compose.yml
  licence: Apache-2.0
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/trilium.svg
