id: vikunja
name: Vikunja
summary: To-do lists and projects, as lists, boards or a calendar.
description: |
  Vikunja organises tasks into projects shown as lists, Kanban boards, tables
  or a Gantt chart, with due dates, labels and sharing. Register the first
  account on the first visit.
icon: icon.svg
category: tools
version: 2.7.1
project: https://github.com/go-vikunja/vikunja
exposure: private
own_login: true
web:
  port: 3456
  path: /
  component: app
volumes:
  - name: files
    path: /app/vikunja/files
  - name: mysql
    path: /var/lib/mysql
settings:
  - key: VIKUNJA_DATABASE_PASSWORD
    label: 'Container Variable: VIKUNJA_DATABASE_PASSWORD'
    type: password
    default: generate
  - key: DB_ROOT_PASSWORD
    label: Database administrator password
    type: password
    default: generate
health:
  http: /api/v1/info
components:
  - name: app
    image: docker.io/vikunja/vikunja:2.7.1@sha256:f7dc8428d10aef17f3075886d3c1c022f566ec456f88985f02c137f4fc534576
    after:
      - db
  - name: db
    image: docker.io/library/mariadb:11@sha256:efb4959ef2c835cd735dbc388eb9ad6aab0c78dd64febcd51bc17481111890c4
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/05e3501e90017f2eb74d29f5d5bef13c3615a0af/Apps/vikunja-v2/docker-compose.yml
  licence: MIT
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/vikunja.svg
