id: wikijs
name: Wiki.js
summary: A wiki with a Markdown editor, search and per-page permissions.
description: |
  Wiki.js keeps your notes and documentation as pages edited in Markdown or a
  visual editor, with search, history and permissions. The first visit creates
  its administrator account.
icon: icon.svg
category: tools
image: docker.io/linuxserver/wikijs:2.5.317@sha256:c85bd3099014aee55bbffcf02008c11d68b9f503187b34c9eabe584bd4ff6ab0
version: 2.5.317
project: https://github.com/requarks/wiki
exposure: private
own_login: true
web:
  port: 3000
  path: /
volumes:
  - name: config
    path: /config
  - name: data
    path: /data
settings:
  - key: PGID
    label: 'Container Variable: PGID'
    type: text
    default: '1000'
  - key: PUID
    label: 'Container Variable: PUID'
    type: text
    default: '1000'
  - key: TZ
    label: Time zone
    type: timezone
    default: auto
health:
  http: /healthz
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/05e3501e90017f2eb74d29f5d5bef13c3615a0af/Apps/wikijs/docker-compose.yml
  licence: MIT
  converted: '2026-10-29'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/wikijs.svg
