id: wordpress
name: WordPress
summary: The web's most used site builder and blog, with its themes and plugins.
description: |
  WordPress runs a blog or a whole site from themes and plugins, with its own
  editor and accounts. The first visit asks for the site's name and its
  administrator account.
icon: icon.svg
category: tools
version: 7.1.4
project: https://github.com/WordPress/WordPress
exposure: private
own_login: true
web:
  port: 80
  path: /
  component: app
volumes:
  - name: html
    path: /var/www/html
  - name: mysql
    path: /var/lib/mysql
settings:
  - key: DB_PASSWORD
    label: Database password
    type: password
    default: generate
  - key: DB_ROOT_PASSWORD
    label: Database administrator password
    type: password
    default: generate
health:
  http: /wp-login.php
components:
  - name: app
    image: docker.io/library/wordpress:7.1.4@sha256:12ec50e21cb81a5ea964669d434578b7da4a101a45aef83f5f1c2227bcd1b058
    after:
      - db
  - name: db
    image: docker.io/library/mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
source:
  from: casaos
  url: https://github.com/bigbeartechworld/big-bear-casaos/blob/9196c7c34f9cb6ce801aa0fd8747c5356dd138fa/Apps/wordpress-v7/docker-compose.yml
  licence: MIT
  converted: '2026-11-02'
  icon:
    pack: dashboard-icons
    licence: Apache-2.0
    url: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/83f32e08257b66fbd971ac8d7645f5b38d52e85d/svg/wordpress.svg
